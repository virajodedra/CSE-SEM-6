<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style></style>
</head>
<body>
    <script>
        let start = parseInt(prompt(" Enter the number : "));
        let end = parseInt(prompt(" Enter the number : "));
        let flag = true;
        for( let temp = start; temp < end + 1; temp++ ){
            for( let i = 2; i < Math.sqrt(temp) + 1; i++ ) {
                if( temp % i == 0) {
                    flag = false;
                    break;
                }
            }
            if( flag ) {
            console.log(` The number : ${temp} is a PRIME number .`);
            }
            else{
                console.log(` The number : ${temp} is not a PRIME number .`);

            }
        }

        
        
    </script>
</body>
</html>
