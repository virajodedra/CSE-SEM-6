<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style></style>
</head>
<body>
    <script>
        let num = parseInt(prompt(" Enter the number to find it's factors : "));

        for( let i = 1; i < num + 1 ; i++ ) {
            if( num % i == 0) {
                console.log( `The number : ${i} is the factor of the ${num}` );
            }
        }

        
    </script>
</body>
</html>
