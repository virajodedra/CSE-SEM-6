    <script>

        let rows = parseInt(prompt(" Enter the number of rows : "));

        for( let i = rows; i >= 1; i-- ) {
            let pattern = "";
            // spaces
            for( let j = 1; j <= rows - i; j++ ) {
                pattern += "  ";
            }
            // stars
            for( let k = 1; k <= i; k++ ) {
                pattern += "* ";
            }
            console.log(pattern);
        }



    </script>
