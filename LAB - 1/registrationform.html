<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2> Registration Form </h2>
    <form action="">
        <label for="name">Name : </label>
        <input type="text" id="name" name="name">
        <br><br>
        <label for="password">password : </label>
        <input type="password" id="password" name="password" maxlength="12" minlength="8">
        <br><br>
        <label for="repassword">repeat password : </label>
        <input type="password" id="repassword" name="repassword" maxlength="12" minlength="8">
        <br><br>
        <label for="age">Age : </label>
        <input type="text" id="age" name="age">
        <br><br>
        <label for="enrollment">Enrollment : </label>
        <input type="text" id="enrollment" name="enrollment">
        <br><br>
        <label for="email"> Email : </label>
        <input type="email" name="email" id="email">
        <br><br>
        <input type="submit">

    </form>


    <script>
        const form = document.querySelector('form');

        form.addEventListener('submit', (temp) => {
            temp.preventDefault();
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const password = document.getElementById('password').value;
            const repassword = document.getElementById('repassword').value;
            const enrollment = document.getElementById('enrollment').value;
            const email = document.getElementById('email').value;

            console.log(name, password, age, enrollment, email);
            if( name == null || name == " " || name.length < 3 ) {
                alert(" Please enter a name again ");
                temp.preventDefault();
            }

            const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,12}$/;
            if( !passwordRegex.test(password) ) {
                alert(" Password must be 8-12 characters long and include at least one letter and one number. ");
                temp.preventDefault();
            }
            if( password !== repassword ) {
                alert(" Passwords do not match. Please re-enter. ");
                temp.preventDefault();
            }
            const ageNum = parseInt(age);
            if( isNaN(ageNum) || ageNum < 18 || ageNum > 100 ) {
                alert(" Please enter a valid age between 18 and 100. ");
                temp.preventDefault();
            }


        }, false);

    </script>
    
</body>
</html>
