<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style></style>
</head>
<body>
    <script>
        let first = parseInt(prompt(" Enter the number : "));
        let second  = parseInt(prompt(" Enter the number : "));
        let op  = prompt(" Enter the number : ");
        
        switch(op){
            case "+" :
                console.log(first + second);
                break;
            case "-" :
                console.log(first - second);
                break;
            case "*" :
                console.log(first * second);
                break;
            case "/" :
                console.log(first / second);
                break;
        }
        
    </script>
</body>
</html>
