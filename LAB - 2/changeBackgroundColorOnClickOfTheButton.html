<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Changing the background color of the body by clicking the button  </title>
</head>
<body>
    
    <button onclick="changeColor()" > Click Me ! </button>
    
    <script>
        let color = "cyan";
        function changeColor(){

            if( color == "cyan" ) {
                document.body.style.backgroundColor = color;
                color = "red";
            }
            else{
                document.body.style.backgroundColor = color;
                color = "cyan";
            }
        }
    </script>
</body>
</html>
