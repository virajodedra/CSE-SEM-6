<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD using the Array</title>
</head>
<body>

    <input type="text" id="name" placeholder="Add Your Name here">
    <button onclick="addValue()"> Add name </button>
    <button onclick="deleteName()"> Delete name </button>
    
    <h5 id="result"></h5>

    <input type="text" id="edit" placeholder="Enter the Updating id here :">
    <button onclick="editName()"> Edit Name </button>

    <script>
        let names = [];

        function addValue() {
            let val = document.getElementById('name').value;
            document.getElementById('name').value = "";
            names.push(val);

            console.log(names);
            showNames();
        }

        function editName() {
            let val = document.getElementById('name').value;
            let idx = document.getElementById('edit').value;
            document.getElementById('name').value = "";
            
            names[idx] = val;

            console.log(names);
            showNames();
        }

        function deleteName() {
            let idx = parseInt(document.getElementById('name').value);
            document.getElementById('name').value = "";
            
            names.splice(idx, 1);

            console.log(names);
            showNames();
        }

        function showNames() {
            document.getElementById("result").innerText = `Names: [ ${names.join(", ")} ]`;
        }


    </script>
    
</body>
</html>
