<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Mouse Pointer Check </title>
</head>
<body>

    <h1>Mouse Pointer Check</h1>
    <p id="mouse"></p>
    
</body>
<script>
  document.addEventListener('mousedown', function(event){
        if( event.button === 0 ) {
            document.getElementById('mouse').innerHTML = " Left Mouse Button Clicked ";
        }
        else if( event.button === 1 ) {
            document.getElementById('mouse').innerHTML = " Middle Mouse Button Clicked ";
        }
        else if( event.button === 2 ) {
            document.getElementById('mouse').innerHTML = " Right Mouse Button Clicked ";
        }
  })
    </script>

</html>
